name: Lagu Platform — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_REGION: asia-south1
  GCP_PROJECT: ascendant-might-248610
  REGISTRY: asia-south1-docker.pkg.dev/ascendant-might-248610/app-images

jobs:
  # ─── Detect which services changed ──────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      postgres: ${{ steps.filter.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'libs/common/**'
              - 'libs/events/**'
              - 'libs/membership/**'
              - 'libs/security/**'
              - 'libs/storage/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/libs.versions.toml'
            schema-registry:
              - *shared
              - 'apps/schema-registry/**'
            record-service:
              - *shared
              - 'apps/record-service/**'
            workflow-service:
              - *shared
              - 'apps/workflow-service/**'
            search-service:
              - *shared
              - 'apps/search-service/**'
            automation-service:
              - *shared
              - 'apps/automation-service/**'
            notification-service:
              - *shared
              - 'apps/notification-service/**'
            document-service:
              - *shared
              - 'apps/document-service/**'
            vendor-service:
              - *shared
              - 'apps/vendor-service/**'
            listing-service:
              - *shared
              - 'apps/listing-service/**'
            event-service:
              - *shared
              - 'apps/event-service/**'
            booking-service:
              - *shared
              - 'apps/booking-service/**'
            postgres:
              - 'infra/postgres/**'

      - name: Build service matrix
        id: matrix
        env:
          SCHEMA_REGISTRY: ${{ steps.filter.outputs.schema-registry }}
          RECORD_SERVICE: ${{ steps.filter.outputs.record-service }}
          WORKFLOW_SERVICE: ${{ steps.filter.outputs.workflow-service }}
          SEARCH_SERVICE: ${{ steps.filter.outputs.search-service }}
          AUTOMATION_SERVICE: ${{ steps.filter.outputs.automation-service }}
          NOTIFICATION_SERVICE: ${{ steps.filter.outputs.notification-service }}
          DOCUMENT_SERVICE: ${{ steps.filter.outputs.document-service }}
          VENDOR_SERVICE: ${{ steps.filter.outputs.vendor-service }}
          LISTING_SERVICE: ${{ steps.filter.outputs.listing-service }}
          EVENT_SERVICE: ${{ steps.filter.outputs.event-service }}
          BOOKING_SERVICE: ${{ steps.filter.outputs.booking-service }}
        run: |
          services=()
          [[ "$SCHEMA_REGISTRY" == "true" ]] && services+=("schema-registry")
          [[ "$RECORD_SERVICE" == "true" ]] && services+=("record-service")
          [[ "$WORKFLOW_SERVICE" == "true" ]] && services+=("workflow-service")
          [[ "$SEARCH_SERVICE" == "true" ]] && services+=("search-service")
          [[ "$AUTOMATION_SERVICE" == "true" ]] && services+=("automation-service")
          [[ "$NOTIFICATION_SERVICE" == "true" ]] && services+=("notification-service")
          [[ "$DOCUMENT_SERVICE" == "true" ]] && services+=("document-service")
          [[ "$VENDOR_SERVICE" == "true" ]] && services+=("vendor-service")
          [[ "$LISTING_SERVICE" == "true" ]] && services+=("listing-service")
          [[ "$EVENT_SERVICE" == "true" ]] && services+=("event-service")
          [[ "$BOOKING_SERVICE" == "true" ]] && services+=("booking-service")

          if [ ${#services[@]} -eq 0 ]; then
            json="[]"
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -sc .)
          fi
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Changed services: $json"

  # ─── Build & test (matrix over changed services) ────────────────────────────
  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build & test
        run: ./gradlew :apps:${{ matrix.service }}:build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: apps/${{ matrix.service }}/build/reports/tests/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: apps/${{ matrix.service }}/build/libs/*-SNAPSHOT.jar

  # ─── End-to-end integration test ────────────────────────────────────────────
  # Boots Postgres/Redis/Kafka/OpenSearch plus five services as real containers and
  # drives schema → record → workflow → publish → index → search across them.
  #
  # Deliberately NOT in the `build` matrix: that job only builds services whose paths
  # changed, while this needs all six bootJars regardless. It runs independently and in
  # parallel rather than after `build`, so a failure here surfaces at the same time.
  #
  # Also deliberately NOT in `deploy`'s needs chain. This test has never run in CI and
  # is resource-hungry enough to be flaky on a shared runner; gating releases on it
  # before it has demonstrated a stable green would mean an unproven test can block
  # every deploy. It reports as its own check — promote it to a required check in
  # branch protection once it has been green for a while, which is a repo setting
  # rather than a change here.
  integration-test:
    runs-on: ubuntu-latest
    # Nine-plus containers, five of them JVMs. A hung run should fail rather than sit
    # burning runner minutes to the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Recorded on every run because container startup timeouts are the expected
      # failure mode here, and "how much headroom did the runner have" is the first
      # question worth asking when one happens. Cheap to capture, painful to lack.
      - name: Runner capacity
        run: |
          echo "cpus=$(nproc)  mem=$(free -h | awk '/Mem:/{print $2}')  disk=$(df -h / | awk 'NR==2{print $4}')"
          docker version --format 'docker={{.Server.Version}}'

      - name: Run end-to-end integration test
        run: ./gradlew :apps:integration-test:test --no-daemon

      # Testcontainers dumps a failed container's own logs into the test output, so the
      # job log carries the root cause; these are the structured results to go with it.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            apps/integration-test/build/reports/tests/
            apps/integration-test/build/test-results/

  # ─── Build & push Docker images (main branch only, matrix over changed services) ─
  docker:
    needs: [changes, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: apps/${{ matrix.service }}/build/libs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/lagu-platform-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/lagu-platform-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Build & push custom Postgres image (when init.sql changes) ─────────────
  docker-postgres:
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push postgres image
        uses: docker/build-push-action@v6
        with:
          context: infra/postgres
          file: infra/postgres/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/lagu-platform-postgres:latest
            ${{ env.REGISTRY }}/lagu-platform-postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

  # ─── Deploy: DISABLED ───────────────────────────────────────────────────────
