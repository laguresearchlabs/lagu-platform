spring:
  application:
    name: record-service
  # "loc" is for local (non-Docker) IDE/bootRun development only. Do not set a
  # default active profile here — a Docker image must never pick up application-loc.yml's
  # hardcoded localhost DB/Kafka/Redis config. Activate it explicitly for local runs, e.g.
  # SPRING_PROFILES_ACTIVE=loc ./gradlew :apps:<name>:bootRun
  # profiles:
  #  active: loc

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      schema: records
      maximum-pool-size: 15
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: records
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

  flyway:
    schemas: records
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: record-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lagu.platform.events"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.lagu.platform.events.WorkflowEvent
    listener:
      ack-mode: MANUAL

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"

platform:
  outbox:
    enabled: true
    table: record_outbox
  storage:
    # Key prefix this service owns. Scope its bucket IAM binding to the same prefix so
    # record-service can neither read nor overwrite another service's objects — that
    # scoping is what replaces the old single-pod credential boundary.
    domain: record
    provider: ${STORAGE_PROVIDER:gcs}
    upload-url-ttl: 15m
    download-url-ttl: 10m
    gcs:
      bucket: ${GCS_BUCKET:}
      # Keyless setups only (no private key in the pod): signing then goes through IAM
      # signBlob while impersonating this account. Unset when a key file is mounted.
      service-account-email: ${GCS_SIGNER_SA:}
      # The deployed path: prod is on-prem k3s with no Workload Identity, so each service
      # mounts its own key, IAM-conditioned to its own object prefix.
      credentials-location: ${GCP_CREDENTIALS_LOCATION:}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}
    scanner:
      # Streams every confirmed upload to clamd before it is persisted. Off by default so local
      # runs and tests need no daemon; on wherever real uploads happen. When enabled an
      # unreachable clamd fails uploads — that is the point of scanning, and this flag is the
      # supported way to switch it off rather than a timeout doing it silently.
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
      timeout: 30s
