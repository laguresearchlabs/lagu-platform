spring:
  application:
    name: event-service
  # "loc" is for local (non-Docker) IDE/bootRun development only. Do not set a
  # default active profile here — a Docker image must never pick up application-loc.yml's
  # hardcoded localhost DB/Kafka/Redis config. Activate it explicitly for local runs, e.g.
  # SPRING_PROFILES_ACTIVE=loc ./gradlew :apps:<name>:bootRun
  # profiles:
  #   active: loc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lagu_event}
    username: ${DB_USERNAME:lagu}
    password: ${DB_PASSWORD:lagu}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: event-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.lagu.platform.*"

server:
  port: ${SERVER_PORT:8110}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.show-details: always

platform:
  storage:
    # Key prefix this service owns. Scope its bucket IAM binding to the same prefix so
    # event-service can neither read nor overwrite record-service's or document-service's
    # objects — that scoping is what replaces the old single-pod credential boundary.
    domain: event
    provider: ${STORAGE_PROVIDER:gcs}
    upload-url-ttl: 15m
    download-url-ttl: 10m
    gcs:
      bucket: ${GCS_BUCKET:}
      service-account-email: ${GCS_SIGNER_SA:}
      credentials-location: ${GCP_CREDENTIALS_LOCATION:}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}
    scanner:
      enabled: ${CLAMAV_ENABLED:false}
      host: ${CLAMAV_HOST:clamav}
      port: ${CLAMAV_PORT:3310}
      timeout: 30s

  security:
    # GET /api/v1/events/share/{id} only — Open Graph crawlers rendering a share link's
    # preview card can't authenticate. The handler itself serves PUBLIC events only and
    # 404s everything else (EventService.getSharePreview).
    public-paths: ${PLATFORM_SECURITY_PUBLIC_PATHS:/api/v1/events/share}
